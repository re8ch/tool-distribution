apiVersion: governance.re8ch.com/v1alpha1
kind: ProjectBinding
metadata:
  name: tool-distribution
spec:
  parent:
    catalog: platform
    repository: git@gitlab.com:reachievellc/service-backend.git
    catalogPath: catalogs/platform/modules/tool-distribution
    submodulePath: catalogs/platform/modules/tool-distribution/source
  identity:
    maintainerAddress: tool-distribution-maintain@phonaid.com
    accountClass: project-maintainer
    googleWorkspacePolicy: eligible
  workspace:
    name: tool-distribution-maintain
    oneActivePerAccount: true
    branchPrefix: workspace/tool-distribution-maintain/
  contract:
    transport: branch-pull-request
    completion: pull-request-closed
    evidenceAuthority: kubernetes
